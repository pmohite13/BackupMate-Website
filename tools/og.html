<!doctype html>
<!-- The source of src/assets/og.png, the picture shown when a page of the site
     is shared on WhatsApp, LinkedIn or X. Rendered at exactly 1200 x 630 with a
     headless browser (see README.md, "The share image") and committed as PNG,
     because the sharing sites do not all read WebP or SVG. Regenerate it when
     the headline on the home page changes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #17202e; background: #ffffff;
    display: flex; flex-direction: column; justify-content: space-between; padding: 64px 72px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 700; }
  .brand svg { width: 40px; height: 40px; color: #2563eb; }
  h1 { font-size: 58px; line-height: 1.1; letter-spacing: -.02em; margin: 0; max-width: 1000px; font-weight: 700; }
  h1 span { color: #2563eb; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 26px; color: #4a5568; }
  .foot .url { color: #2563eb; font-weight: 600; }
  .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 14px; background: #2563eb; }
</style>
</head>
<body>
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>BackupMate</div>
  <h1>Every PC in your office, backed up.<br><span>Nothing leaves the building.</span></h1>
  <div class="foot"><div>In-office backup for small Windows offices.<br>Free for 3 PCs. Priced by the PC, not the gigabyte.</div><div class="url">backupmate.buzzneuron.com</div></div>
  <div class="bar"></div>
</body>
</html>

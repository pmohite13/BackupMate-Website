<svg class="fig fig-keys" viewBox="0 0 520 210" role="img" aria-labelledby="fig-keys-t fig-keys-d" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-keys-t">Who holds the encryption key: the PC only, or the PC and the server</title>
  <desc id="fig-keys-d">Two panels. In the first, "you hold the key", a PC has a key and the server holds a padlock: it stores what it cannot read. In the second, "the server keeps a copy", both the PC and the server have a key, and an administrator can recover files without the PC.</desc>
  <g transform="translate(0,0)">
    <rect class="panel" x="0" y="0" width="250" height="210" rx="12"/>
    <text class="lbl-strong" x="16" y="26">You hold the key (default)</text>
    <g transform="translate(24,60)"><rect class="box" width="64" height="42" rx="6"/><text class="lbl" x="32" y="62" text-anchor="middle">PC</text>
      <g class="key" transform="translate(44,-14)"><circle cx="0" cy="0" r="6"/><line x1="5" y1="3" x2="18" y2="16"/><line x1="12" y1="10" x2="9" y2="13"/><line x1="16" y1="14" x2="13" y2="17"/></g></g>
    <path class="link" d="M88 81 L 150 81"/>
    <g transform="translate(152,55)"><rect class="box server" width="70" height="56" rx="8"/>
      <g class="lock" transform="translate(35,28)"><rect x="-9" y="-3" width="18" height="14" rx="2"/><path d="M-5 -3 V-8 a5 5 0 0 1 10 0 V-3"/></g>
      <text class="lbl" x="35" y="76" text-anchor="middle">Server</text></g>
    <text class="lbl-muted" x="16" y="160">Stores what it cannot read.</text>
    <text class="lbl-muted" x="16" y="178">Lose the passphrase, lose the backups:</text>
    <text class="lbl-muted" x="16" y="196">nobody can open them, including us.</text>
  </g>
  <g transform="translate(270,0)">
    <rect class="panel" x="0" y="0" width="250" height="210" rx="12"/>
    <text class="lbl-strong" x="16" y="26">The server keeps a copy</text>
    <g transform="translate(24,60)"><rect class="box" width="64" height="42" rx="6"/><text class="lbl" x="32" y="62" text-anchor="middle">PC</text>
      <g class="key" transform="translate(44,-14)"><circle cx="0" cy="0" r="6"/><line x1="5" y1="3" x2="18" y2="16"/><line x1="12" y1="10" x2="9" y2="13"/><line x1="16" y1="14" x2="13" y2="17"/></g></g>
    <path class="link" d="M88 81 L 150 81"/>
    <g transform="translate(152,55)"><rect class="box server" width="70" height="56" rx="8"/>
      <g class="key" transform="translate(28,22)"><circle cx="0" cy="0" r="6"/><line x1="5" y1="3" x2="18" y2="16"/><line x1="12" y1="10" x2="9" y2="13"/><line x1="16" y1="14" x2="13" y2="17"/></g>
      <text class="lbl" x="35" y="76" text-anchor="middle">Server</text></g>
    <text class="lbl-muted" x="16" y="160">An administrator can recover any</text>
    <text class="lbl-muted" x="16" y="178">PC's files without that PC, and can</text>
    <text class="lbl-muted" x="16" y="196">read them. Chosen before PCs connect.</text>
  </g>
</svg>
